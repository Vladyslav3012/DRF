<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gemini Chat (DRF + Channels)</title>
  <style>
    body { margin:0; font-family:system-ui,Segoe UI,Arial; background:#0b0e14; color:#e7eaf0; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
    .grid { display: grid; grid-template-columns: clamp(260px, 28vw, 360px) minmax(0, 1fr); gap: 14px; }
    .card { background:#121826; border:1px solid #263045; border-radius:14px; padding:12px; }
    h2,h3 { margin:0 0 10px; }
    label { display:block; font-size:12px; color:#aab3c5; margin:10px 0 6px; }
    input, select, textarea {
      width:100%; box-sizing:border-box;
      padding:10px; border-radius:10px;
      border:1px solid #2a3651; background:#0f1422; color:#e7eaf0;
    }
    textarea { min-height:44px; max-height:140px; resize:vertical; }
    button {
      padding:10px 12px; border-radius:10px; border:1px solid #2a3651;
      background:#1a2340; color:#fff; cursor:pointer;
    }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .row { display:flex; gap:10px; align-items:center; }
    .row > * { flex:1; }
    .hint { font-size:12px; color:#93a0b8; margin-top:8px; line-height:1.35; }
    code { background:#0f1422; border:1px solid #2a3651; padding:2px 6px; border-radius:8px; }

    .status { font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid #2a3651; display:inline-block; }
    .ok { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.35); }
    .bad { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.35); }

    .list { max-height:240px; overflow:auto; border:1px solid #2a3651; border-radius:12px; background:#0f1422; }
    .item { padding:10px; border-bottom:1px solid #1c2740; cursor:pointer; }
    .item:hover { background:#121c33; }
    .item.active { outline: 2px solid rgba(99,102,241,.35); }

    .chat { height:520px; overflow:auto; padding:12px; background:#0f1422; border-radius:12px; border:1px solid #2a3651; }
    .msg { max-width:78%; padding:10px 12px; border-radius:14px; margin:8px 0; white-space:pre-wrap; line-height:1.35; }
    .msg.user { margin-left:auto; background:#1f2a44; border:1px solid #32456e; }
    .msg.model { margin-right:auto; background:#142a1f; border:1px solid #2d6a46; }
    .msg.sys { margin-right:auto; background:#2a1b14; border:1px solid #6a3d2d; font-size:13px; max-width:100%; }

    .composer { display:flex; gap:10px; margin-top:12px; }
    .composer textarea { flex:1; }
      /* щоб флекс-рядки не ламали верстку */
.row { flex-wrap: wrap; }
.row > * { min-width: 180px; }

/* щоб довгі токени/URL не робили горизонтальний скрол */
.hint, .hint code, .msg, .item, .chat { overflow-wrap: anywhere; word-break: break-word; }
code { white-space: pre-wrap; }

/* адаптив: на вузьких екранах в одну колонку */
@media (max-width: 980px) {
  .grid { grid-template-columns: 1fr; }
  .chat { height: 420px; }
}
/* close button for messages */
.msg { position: relative; padding-right: 36px; }

.msg .close-btn{
  position: absolute;
  top: 6px;
  right: 8px;
  width: 22px;
  height: 22px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.08);
  color: #fff;
  cursor: pointer;
  line-height: 20px;
  font-size: 14px;
  padding: 0;
}

.msg .close-btn:hover{
  background: rgba(255,255,255,.16);
}
      /* typing / loading indicator */
.typing {
  display: inline-flex;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border-radius: 14px;
  margin: 8px 0;
  background: #142a1f;
  border: 1px solid #2d6a46;
  max-width: 78%;
}

.spinner {
  width: 16px;
  height: 16px;
  border-radius: 999px;
  border: 2px solid rgba(255,255,255,.25);
  border-top-color: rgba(255,255,255,.9);
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }


  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="justify-content:space-between; margin-bottom:12px;">
      <h2 style="margin:0;">Gemini Chat (REST + WebSocket)</h2>
      <div id="wsStatus" class="status bad">WS: DISCONNECTED</div>
    </div>

    <div class="grid">
      <!-- LEFT -->
      <div class="card">
<!--        <h3>Налаштування</h3>-->

<!--        <label>API Base URL</label>-->
<!--        <input id="apiBase" value="http://127.0.0.1:8000" />-->

<!--        <div class="row">-->
<!--          <div>-->
<!--            <label>Auth header type</label>-->
<!--            <select id="authType">-->
<!--              <option value="JWT" selected>JWT</option>-->
<!--              <option value="Bearer">Bearer</option>-->
<!--            </select>-->
<!--          </div>-->
<!--          <div>-->
<!--            <label>Login path</label>-->
<!--            <input id="loginPath" value="/api/v1/login/" />-->
<!--          </div>-->
<!--        </div>-->

<!--        <div class="hint">-->
<!--          REST токен піде як <code>Authorization: JWT &lt;access&gt;</code>.-->
<!--          WS токен піде в URL як <code>?token=&lt;access&gt;</code>.-->
<!--        </div>-->

<!--        <hr style="border:0; border-top:1px solid #263045; margin:14px 0;">-->
<!-- hidden settings (fixed values) -->
<input type="hidden" id="apiBase" value="http://127.0.0.1:8000">
<input type="hidden" id="authType" value="JWT">
<input type="hidden" id="loginPath" value="/api/v1/login/">

        <h3>Auth</h3>
        <label>Email</label>
        <input id="email" placeholder="you@example.com" />
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" />

        <div class="row" style="margin-top:10px;">
          <button id="loginBtn">Login</button>
          <button id="logoutBtn">Logout</button>
        </div>

        <label style="margin-top:12px;">Access token</label>
        <input id="accessToken" placeholder="можна вставити вручну" />
        <div class="hint">Зберігається в localStorage.</div>

        <hr style="border:0; border-top:1px solid #263045; margin:14px 0;">

        <h3>Chats</h3>
        <div class="row">
          <button id="refreshChatsBtn">Refresh</button>
          <button id="newChatBtn">New chat</button>
        </div>

    <label style="margin-top:12px;">Model</label>
<select id="modelName">
  <option value="gemini-flash-latest" selected>Gemini 2.0 Flash Lite</option>
  <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
  <option value="gemini-3-pro-preview">Gemini 3 Pro Preview</option>
  <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
</select>


        <div class="list" id="chatsList" style="margin-top:10px;"></div>

        <div class="hint">
          Використовуються ендпоінти:
          <div><code>/api/v1/gemini/chats/</code></div>
          <div><code>/api/v1/gemini/chats/&lt;uuid&gt;/</code></div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <div>
            <h3 style="margin-bottom:6px;">Чат</h3>
            <div class="hint" id="activeChatHint">Активний чат: —</div>
          </div>
          <div class="row" style="justify-content:flex-end;">
            <button id="disconnectWsBtn" disabled>Disconnect</button>
            <button id="clearChatBtn">Clear</button>
          </div>
        </div>

        <div class="hint" id="wsUrlHint" style="margin:8px 0;"></div>
        <div class="chat" id="chatBox"></div>

        <div class="composer">
          <textarea id="prompt" placeholder="Напиши повідомлення... (Ctrl+Enter — send)"></textarea>
          <button id="sendBtn" disabled>Send</button>
        </div>

        <div class="hint">
          Формат відправки: <code>{"prompt":"..."}</code> • Відповідь: <code>{"role":"user|model","content":"..."}</code>
        </div>
      </div>
    </div>
  </div>

<script>
  // ---------------------------
  // Helpers
  // ---------------------------
  const el = (id) => document.getElementById(id);
  const chatBox = el("chatBox");
  const chatsList = el("chatsList");

  let ws = null;
  let activeChatId = null;

  function apiBase() {
    return el("apiBase").value.trim().replace(/\/$/, "");
  }
  function loginUrl() {
    const base = apiBase();
    const path = el("loginPath").value.trim();
    return base + (path.startsWith("/") ? path : ("/" + path));
  }
function authHeader() {
  const type = (el("authType").value || "JWT").trim(); // hidden input
  const token = el("accessToken").value.trim();
  return token ? `${type} ${token}` : "";
}

  function saveToken(token) {
    el("accessToken").value = token || "";
    localStorage.setItem("accessToken", token || "");
  }
  function loadToken() {
    const t = localStorage.getItem("accessToken") || "";
    el("accessToken").value = t;
  }

  function setWsStatus(ok, text) {
    const s = el("wsStatus");
    s.textContent = "WS: " + text;
    s.classList.toggle("ok", ok);
    s.classList.toggle("bad", !ok);
  }

function addMsg(role, content) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : role === "model" ? "model" : "sys");

  // текст
  const text = document.createElement("div");
  text.textContent = content;
  div.appendChild(text);

  // кнопка закриття (робимо для sys; хочеш для всіх — прибери if)
  if (role === "sys") {
    const btn = document.createElement("button");
    btn.className = "close-btn";
    btn.type = "button";
    btn.textContent = "×";
    btn.title = "Закрити";
    btn.onclick = () => div.remove();
    div.appendChild(btn);
  }

  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;

  // OPTIONAL: ліміт на кількість sys-повідомлень (щоб не засмічувало)
  const MAX_SYS = 8;
  const sysMsgs = chatBox.querySelectorAll(".msg.sys");
  if (sysMsgs.length > MAX_SYS) {
    for (let i = 0; i < sysMsgs.length - MAX_SYS; i++) sysMsgs[i].remove();
  }
}

let typingEl = null;

function showTyping(text = "Wait a sec...") {
  if (typingEl) return;

  typingEl = document.createElement("div");
  typingEl.className = "typing";

  const sp = document.createElement("div");
  sp.className = "spinner";

  const t = document.createElement("div");
  t.textContent = text;

  typingEl.appendChild(sp);
  typingEl.appendChild(t);
  chatBox.appendChild(typingEl);
  chatBox.scrollTop = chatBox.scrollHeight;

  el("sendBtn").disabled = true;
}

function hideTyping() {
  if (typingEl) {
    typingEl.remove();
    typingEl = null;
  }
  updateUiState();
}

  function wsBaseFromApi() {
    const base = apiBase();
    if (base.startsWith("https://")) return base.replace("https://", "wss://");
    if (base.startsWith("http://")) return base.replace("http://", "ws://");
    return base; // якщо вже ws://
  }

  function wsUrlForChat(chatId) {
    const base = wsBaseFromApi().replace(/\/$/, "");
    const token = encodeURIComponent(el("accessToken").value.trim());
    return `${base}/ws/chat/${chatId}/?token=${token}`;
  }

  function updateUiState() {
    const hasToken = !!el("accessToken").value.trim();
    const hasChat = !!activeChatId;

    el("refreshChatsBtn").disabled = !hasToken;
    el("newChatBtn").disabled = !hasToken;

    el("disconnectWsBtn").disabled = !ws;
    el("sendBtn").disabled = !(ws && ws.readyState === WebSocket.OPEN);

    el("activeChatHint").textContent = "Активний чат: " + (activeChatId || "—");
    el("wsUrlHint").innerHTML = hasChat
      ? `WS URL: <code>${wsUrlForChat(activeChatId)}</code>`
      : "";
  }

  async function apiFetch(path, options = {}) {
    const url = apiBase() + path;
    const headers = options.headers || {};
    const ah = authHeader();
    if (ah) headers["Authorization"] = ah;
    if (!(options.body instanceof FormData) && options.body !== undefined) {
      headers["Content-Type"] = "application/json";
    }
    const res = await fetch(url, { ...options, headers });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    if (!res.ok) {
      const msg = typeof data === "string" ? data : JSON.stringify(data);
      throw new Error(`${res.status} ${res.statusText}: ${msg}`);
    }
    return data;
  }

  // ---------------------------
  // Auth
  // ---------------------------
  async function login() {
    const email = el("email").value.trim();
    const password = el("password").value;

    if (!email || !password) {
      addMsg("sys", "Вкажи email і password.");
      return;
    }

    try {
      const res = await fetch(loginUrl(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}: ${JSON.stringify(data)}`);

      // твій бекенд повертає: { msg: "...", token: { access, refresh } }
      const access = data?.token?.access;
      if (!access) {
        addMsg("sys", "Login OK, але не знайшов token.access у відповіді: " + JSON.stringify(data));
        return;
      }

      saveToken(access);
      addMsg("sys", "Login success ✅ (access token збережено)");
      await refreshChats();
    } catch (e) {
      addMsg("sys", "Login error: " + e.message);
    } finally {
      updateUiState();
    }
  }

  function logout() {
    saveToken("");
    activeChatId = null;
    if (ws) ws.close();
    chatsList.innerHTML = "";
    addMsg("sys", "Logged out.");
    updateUiState();
  }

  // ---------------------------
  // Chats list + create
  // ---------------------------

  function autoConnectWs() {
  // якщо вже підключено або підключається — нічого не робимо
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  if (!activeChatId) return;
  if (!el("accessToken").value.trim()) return;

  connectWs();
}let openSeq = 0;

async function openChat(chatId) {
  const seq = ++openSeq;
  activeChatId = String(chatId);

  if (ws) ws.close();

  hideTyping();              // <-- ДОДАЛИ
  chatBox.innerHTML = "";    // чистимо, щоб історія не дублювалась

  addMsg("sys", `Selected chat: ${activeChatId}`);
  highlightActive();
  updateUiState();

  await loadHistory(chatId, seq);   // <-- передаємо chatId + seq

  if (seq !== openSeq) return;      // якщо юзер вже переключив чат — не підключаємо WS
  autoConnectWs();
}


  function renderChats(items) {
    chatsList.innerHTML = "";
    if (!Array.isArray(items) || items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "item";
      empty.textContent = "Нема чатів (або список порожній).";
      chatsList.appendChild(empty);
      return;
    }

    for (const it of items) {
      const chatId = it.chat_id || it.chatId || it.id; // на всякий
      const title = it.title || "(no title)";
      const model = it.model_name || it.modelName || "";
      const created = it.created_at || it.createdAt || "";

      const div = document.createElement("div");
      div.className = "item" + (chatId === activeChatId ? " active" : "");
      div.innerHTML = `<div style="font-weight:600;">${escapeHtml(title)}</div>
                       <div class="hint">id: <code>${escapeHtml(String(chatId))}</code></div>
                       <div class="hint">${model ? ("model: " + escapeHtml(model) + " • ") : ""}${created ? ("created: " + escapeHtml(created)) : ""}</div>`;
div.onclick = () => openChat(chatId);

      chatsList.appendChild(div);
    }
  }

  function highlightActive() {
    [...chatsList.querySelectorAll(".item")].forEach(n => n.classList.remove("active"));
    [...chatsList.querySelectorAll(".item")].forEach(n => {
      const code = n.querySelector("code");
      if (code && code.textContent === activeChatId) n.classList.add("active");
    });
  }

  async function refreshChats() {
    try {
      const data = await apiFetch("/api/v1/gemini/chats/", { method: "GET" });
      renderChats(data);
      if (!activeChatId && Array.isArray(data) && data.length > 0) {
  await openChat(data[0].chat_id);
}

    } catch (e) {
      addMsg("sys", "Refresh chats error: " + e.message);
    } finally {
      updateUiState();
    }
  }

async function newChat() {
  const modelName = el("modelName").value; // value з <select>
  const payload = { model_name: modelName };

  try {
    const data = await apiFetch("/api/v1/gemini/chats/", {
      method: "POST",
      body: JSON.stringify(payload),
    });

    const chatId = data?.chat_id;
    addMsg("sys", "New chat created ✅ " + (chatId ? `(${chatId})` : ""));
    await refreshChats();

if (chatId) await openChat(chatId);


  } catch (e) {
    addMsg("sys", "New chat error: " + e.message);
  } finally {
    updateUiState();
  }
}


  // ---------------------------
  // Load history
  // ---------------------------
async function loadHistory(chatId = activeChatId, seq = openSeq) {
  if (!chatId) return;

  try {
    const data = await apiFetch(`/api/v1/gemini/chats/${chatId}/`, { method: "GET" });

    // якщо під час запиту користувач переключив чат — не малюємо стару історію
    if (seq !== openSeq || String(chatId) !== String(activeChatId)) return;

    const msgs = data.messages || [];

    // можеш прибрати цей sys, якщо не хочеш спаму:
    // addMsg("sys", "History loaded ✅");

    if (Array.isArray(msgs)) {
      for (const m of msgs) addMsg(m.role, m.content);
    } else {
      addMsg("sys", "messages не масив. Відповідь: " + JSON.stringify(data));
    }
  } catch (e) {
    addMsg("sys", "Load history error: " + e.message);
  }
}


  // ---------------------------
  // WebSocket
  // ---------------------------
function connectWs() {
  if (!activeChatId) return;

  const token = el("accessToken").value.trim();
  if (!token) { addMsg("sys", "Нема access token"); return; }

  const url = wsUrlForChat(activeChatId);
  addMsg("sys", "WS connecting...");
  setWsStatus(false, "CONNECTING");

  const socket = new WebSocket(url);
  ws = socket;

  socket.onopen = () => {
    if (ws !== socket) return;
    addMsg("sys", "WS connected ✅");
    setWsStatus(true, "CONNECTED");
    updateUiState();
  };

  socket.onmessage = (event) => {
    if (ws !== socket) return;

    try {
      const data = JSON.parse(event.data);

      if (data.Error) {
        hideTyping();
        addMsg("sys", "Server error: " + data.Error);
        return;
      }

      // коли прийшла відповідь моделі — прибираємо “думає…”
      if (data.role === "model") {
  hideTyping();
  refreshChats(); // <-- ОЦЕ СЮДИ
}


      addMsg(data.role || "sys", data.content || JSON.stringify(data));
    } catch {
      hideTyping();
      addMsg("sys", "Non-JSON: " + event.data);
    }
  };

  socket.onclose = (ev) => {
    // важливо: не даємо старому сокету обнулити новий ws
    if (ws === socket) ws = null;

    hideTyping();
    addMsg("sys", `WS closed (code=${ev.code})`);
    setWsStatus(false, "DISCONNECTED");
    updateUiState();
  };

  socket.onerror = () => {
    if (ws !== socket) return;
    hideTyping();
    addMsg("sys", "WS error (дивись console)");
  };

  updateUiState();
}


  function disconnectWs() {
    if (ws) ws.close();
  }

  function sendPrompt() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const text = el("prompt").value.trim();
    if (!text) return;

ws.send(JSON.stringify({ prompt: text }));
el("prompt").value = "";
el("prompt").focus();
showTyping();

  }

  // ---------------------------
  // Utils
  // ---------------------------
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;" }[m]));
  }

  // ---------------------------
  // Wire up
  // ---------------------------
  el("loginBtn").onclick = login;
  el("logoutBtn").onclick = logout;

  el("refreshChatsBtn").onclick = refreshChats;
  el("newChatBtn").onclick = newChat;

  el("disconnectWsBtn").onclick = disconnectWs;

el("clearChatBtn").onclick = () => {
  hideTyping();
  chatBox.innerHTML = "";
};


  el("sendBtn").onclick = sendPrompt;
  el("prompt").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendPrompt();
  });

  // init
  loadToken();
  setWsStatus(false, "DISCONNECTED");
  updateUiState();
</script>
</body>
</html>
