<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gemini Chat (DRF + Channels)</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { margin:0; font-family:system-ui,Segoe UI,Arial; background:#0b0e14; color:#e7eaf0; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
    .grid { display: grid; grid-template-columns: clamp(260px, 28vw, 360px) minmax(0, 1fr); gap: 14px; }
    .card { background:#121826; border:1px solid #263045; border-radius:14px; padding:12px; }
    h2,h3 { margin:0 0 10px; }
    label { display:block; font-size:12px; color:#aab3c5; margin:10px 0 6px; }
    input, select, textarea {
      width:100%; box-sizing:border-box;
      padding:10px; border-radius:10px;
      border:1px solid #2a3651; background:#0f1422; color:#e7eaf0;
    }
    textarea { min-height:44px; max-height:140px; resize:vertical; }
    button {
      padding:10px 12px; border-radius:10px; border:1px solid #2a3651;
      background:#1a2340; color:#fff; cursor:pointer;
    }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap: wrap; }
    .row > * { flex:1; min-width: 140px; }
    .hint { font-size:12px; color:#93a0b8; margin-top:8px; line-height:1.35; }
    code { background:#0f1422; border:1px solid #2a3651; padding:2px 6px; border-radius:8px; white-space: pre-wrap; }

    .status { font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid #2a3651; display:inline-block; }
    .ok { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.35); }
    .bad { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.35); }

    .list { max-height:240px; overflow:auto; border:1px solid #2a3651; border-radius:12px; background:#0f1422; }
    .item { padding:10px; border-bottom:1px solid #1c2740; cursor:pointer; }
    .item:hover { background:#121c33; }
    .item.active { outline: 2px solid rgba(99,102,241,.35); }

    .chat { height:520px; overflow:auto; padding:12px; background:#0f1422; border-radius:12px; border:1px solid #2a3651; }

    .msg { max-width:78%; padding:10px 12px; border-radius:14px; margin:8px 0; line-height:1.5; position: relative; padding-right: 36px; word-break: break-word; }
    .msg.user { margin-left:auto; background:#1f2a44; border:1px solid #32456e; }
    .msg.model { margin-right:auto; background:#142a1f; border:1px solid #2d6a46; }
    .msg.sys { margin-right:auto; background:#2a1b14; border:1px solid #6a3d2d; font-size:13px; max-width:100%; }

    /* Стилі для Markdown контенту */
    .msg a { color: #60a5fa; text-decoration: underline; }
    .msg ul, .msg ol { margin: 5px 0; padding-left: 20px; }
    .msg p { margin: 5px 0; }

    .msg .close-btn {
      position: absolute; top: 6px; right: 8px; width: 22px; height: 22px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08); color: #fff; cursor: pointer;
      line-height: 20px; font-size: 14px; padding: 0;
    }
    .msg .close-btn:hover { background: rgba(255,255,255,.16); }

    .composer { display:flex; gap:10px; margin-top:12px; }
    .composer textarea { flex:1; }

    /* Typing indicator */
    .typing { display: inline-flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; margin: 8px 0; background: #142a1f; border: 1px solid #2d6a46; max-width: 78%; }
    .spinner { width: 16px; height: 16px; border-radius: 999px; border: 2px solid rgba(255,255,255,.25); border-top-color: rgba(255,255,255,.9); animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      .chat { height: 420px; }
    }
      /* Додати до існуючих стилів */

.item {
  /* Робимо елемент флексом, щоб рознести текст і кнопку */
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

/* Стиль для кнопки видалення */
.del-btn {
  background: transparent;
  border: none;
  color: #64748b;
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  line-height: 1;
  opacity: 0.6;
  transition: all 0.2s;
}

.del-btn:hover {
  background: rgba(239, 68, 68, 0.2);
  color: #ef4444; /* Червоний */
  opacity: 1;
}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="justify-content:space-between; margin-bottom:12px;">
      <h2 style="margin:0;">Gemini Chat (REST + WebSocket)</h2>
      <div id="wsStatus" class="status bad">WS: DISCONNECTED</div>
    </div>

    <div class="grid">
      <div class="card">
        <input type="hidden" id="apiBase" value="http://127.0.0.1:8000">
        <input type="hidden" id="authType" value="JWT">
        <input type="hidden" id="loginPath" value="/api/v1/login/">

        <h3>Auth</h3>
        <label>Email</label>
        <input id="email" placeholder="you@example.com" />
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" />

        <div class="row" style="margin-top:10px;">
          <button id="loginBtn">Login</button>
          <button id="logoutBtn">Logout</button>
        </div>

        <label style="margin-top:12px;">Access token</label>
        <input id="accessToken" placeholder="можна вставити вручну" />

        <hr style="border:0; border-top:1px solid #263045; margin:14px 0;">

        <h3>Chats</h3>
        <div class="row">
          <button id="refreshChatsBtn">Refresh</button>
          <button id="newChatBtn">New chat</button>
        </div>

        <label style="margin-top:12px;">Model</label>
        <select id="modelName">
          <option value="gemini-2.0-flash-exp" selected>Gemini 2.0 Flash Lite</option>
          <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
        </select>

        <div class="list" id="chatsList" style="margin-top:10px;"></div>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <div>
            <h3 style="margin-bottom:6px;">Чат</h3>
            <div class="hint" id="activeChatHint">Активний чат: —</div>
          </div>
          <div class="row" style="justify-content:flex-end;">
            <button id="disconnectWsBtn" disabled>Disconnect</button>
            <button id="clearChatBtn">Clear</button>
          </div>
        </div>

        <div class="hint" id="wsUrlHint" style="margin:8px 0;"></div>
        <div class="chat" id="chatBox"></div>

        <div class="composer">
          <textarea id="prompt" placeholder="Напиши повідомлення... (Ctrl+Enter — send)"></textarea>
          <button id="sendBtn" disabled>Send</button>
        </div>
      </div>
    </div>
  </div>

<script>
  // ---------------------------
  // Helpers
  // ---------------------------
  const el = (id) => document.getElementById(id);
  const chatBox = el("chatBox");
  const chatsList = el("chatsList");

  let ws = null;
  let activeChatId = null;

  function apiBase() { return el("apiBase").value.trim().replace(/\/$/, ""); }
  function loginUrl() { return apiBase() + el("loginPath").value.trim(); }

  function authHeader() {
    const type = el("authType").value.trim();
    const token = el("accessToken").value.trim();
    return token ? `${type} ${token}` : "";
  }

  function saveToken(token) {
    el("accessToken").value = token || "";
    localStorage.setItem("accessToken", token || "");
  }
  function loadToken() {
    el("accessToken").value = localStorage.getItem("accessToken") || "";
  }

  function setWsStatus(ok, text) {
    const s = el("wsStatus");
    s.textContent = "WS: " + text;
    s.classList.toggle("ok", ok);
    s.classList.toggle("bad", !ok);
  }

  // ✅ ВИПРАВЛЕНО: Рендеринг Markdown (посилання працюватимуть)
  function addMsg(role, content) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : role === "model" ? "model" : "sys");

    const textDiv = document.createElement("div");

    // Якщо повідомлення від моделі - парсимо Markdown
    if (role === "model") {
        try {
            textDiv.innerHTML = marked.parse(content);
        } catch (e) {
            textDiv.textContent = content;
        }
    } else {
        // Юзер або система - просто текст (безпека)
        textDiv.textContent = content;
    }

    div.appendChild(textDiv);

    if (role === "sys") {
      const btn = document.createElement("button");
      btn.className = "close-btn";
      btn.textContent = "×";
      btn.onclick = () => div.remove();
      div.appendChild(btn);
    }

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  let typingEl = null;

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement("div");
    typingEl.className = "typing";
    typingEl.innerHTML = `<div class="spinner"></div><div>Думаю...</div>`;
    chatBox.appendChild(typingEl);
    chatBox.scrollTop = chatBox.scrollHeight;
    el("sendBtn").disabled = true;
  }

  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
    updateUiState();
  }

  function wsUrlForChat(chatId) {
    let base = apiBase();
    if (base.startsWith("https://")) base = base.replace("https://", "wss://");
    else if (base.startsWith("http://")) base = base.replace("http://", "ws://");
    const token = encodeURIComponent(el("accessToken").value.trim());
    return `${base}/ws/chat/${chatId}/?token=${token}`;
  }

  function updateUiState() {
    const hasToken = !!el("accessToken").value.trim();
    const hasChat = !!activeChatId;
    el("refreshChatsBtn").disabled = !hasToken;
    el("newChatBtn").disabled = !hasToken;
    el("disconnectWsBtn").disabled = !ws;
    el("sendBtn").disabled = !(ws && ws.readyState === WebSocket.OPEN);
    el("activeChatHint").textContent = "Активний чат: " + (activeChatId || "—");
    el("wsUrlHint").innerHTML = hasChat ? `WS URL: <code>${wsUrlForChat(activeChatId)}</code>` : "";
  }

  async function apiFetch(path, options = {}) {
    const url = apiBase() + path;
    const headers = options.headers || {};
    const ah = authHeader();
    if (ah) headers["Authorization"] = ah;
    if (options.body && !(options.body instanceof FormData)) {
      headers["Content-Type"] = "application/json";
    }
    const res = await fetch(url, { ...options, headers });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }
    if (!res.ok) throw new Error(typeof data === "string" ? data : JSON.stringify(data));
    return data;
  }

  // ---------------------------
  // Logic
  // ---------------------------
  async function login() {
    const email = el("email").value.trim();
    const password = el("password").value;
    if (!email || !password) return addMsg("sys", "Введіть email/pass");

    try {
      const res = await fetch(loginUrl(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(JSON.stringify(data));

      const access = data?.token?.access;
      if (!access) throw new Error("No token in response");

      saveToken(access);
      addMsg("sys", "Login success ✅");
      await refreshChats();
    } catch (e) {
      addMsg("sys", "Login error: " + e.message);
    } finally {
      updateUiState();
    }
  }

  function logout() {
    saveToken("");
    activeChatId = null;
    if (ws) ws.close();
    chatsList.innerHTML = "";
    addMsg("sys", "Logged out.");
    updateUiState();
  }

  let openSeq = 0;
  async function openChat(chatId) {
    const seq = ++openSeq;
    activeChatId = String(chatId);
    if (ws) ws.close();

    hideTyping();
    chatBox.innerHTML = "";
    addMsg("sys", `Chat opened: ${activeChatId}`);
    highlightActive();
    updateUiState();

    await loadHistory(chatId, seq);
    if (seq === openSeq) connectWs();
  }

 function renderChats(items) {
  chatsList.innerHTML = "";

  if (!Array.isArray(items) || items.length === 0) {
    chatsList.innerHTML = "<div class='item' style='display:block'>Нема чатів.</div>";
    return;
  }

  for (const it of items) {
    const div = document.createElement("div");
    // Додаємо клас active, якщо це поточний чат
    div.className = "item" + (String(it.chat_id) === String(activeChatId) ? " active" : "");

    // Формуємо HTML: зліва текст, справа кнопка
    div.innerHTML = `
      <div style="flex:1; overflow:hidden;">
        <div style="font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
          ${escapeHtml(it.title || "No title")}
        </div>
        <div class="hint">${it.created_at ? it.created_at.substring(0, 10) : ""}</div>
      </div>
      <button class="del-btn" title="Видалити">×</button>
    `;

    // Клік по самому елементу — відкриває чат
    div.onclick = () => openChat(it.chat_id);

    // Клік по кнопці — викликає видалення
    const btn = div.querySelector(".del-btn");
    btn.onclick = (e) => deleteChat(it.chat_id, e);

    chatsList.appendChild(div);
  }
}

  function highlightActive() {
    [...chatsList.querySelectorAll(".item")].forEach(n => n.classList.remove("active"));
    // Проста перевірка по UI, краще через render, але ок
  }
async function deleteChat(chatId, event) {
  // 1. Зупиняємо клік, щоб не відкривався чат
  if (event) event.stopPropagation();

  if (!confirm("Видалити цей чат?")) return;

  try {
    // 2. ✅ ВИКОРИСТОВУЄМО apiFetch (вона сама додасть домен і токен)
    // apiFetch сама викине помилку (throw Error), якщо статус не OK
    await apiFetch(`/api/v1/gemini/chats/${chatId}/`, {
      method: "DELETE"
    });

    addMsg("sys", `Chat ${chatId} deleted 🗑️`);

    // 3. Очищаємо інтерфейс, якщо видалили поточний чат
    if (String(chatId) === String(activeChatId)) {
      activeChatId = null;
      if (ws) ws.close();
      chatBox.innerHTML = "";
      document.getElementById("activeChatHint").textContent = "Активний чат: —";
      // Якщо у вас є el("wsUrlHint"), розкоментуйте:
      // el("wsUrlHint").innerHTML = "";
      updateUiState();
    }

    // 4. Оновлюємо список
    await refreshChats();

  } catch (e) {
    alert("Помилка видалення: " + e.message);
  }
}
  async function refreshChats() {
    try {
      const data = await apiFetch("/api/v1/gemini/chats/", { method: "GET" });
      renderChats(data);
    } catch (e) {
      addMsg("sys", "Refresh error: " + e.message);
    }
  }

  async function newChat() {
    try {
      const model = el("modelName").value;
      const data = await apiFetch("/api/v1/gemini/chats/", {
        method: "POST",
        body: JSON.stringify({ model_name: model })
      });
      addMsg("sys", "Chat created ✅");
      await refreshChats();
      if (data.chat_id) openChat(data.chat_id);
    } catch (e) {
      addMsg("sys", "Create chat error: " + e.message);
    }
  }

  async function loadHistory(chatId, seq) {
    try {
      const data = await apiFetch(`/api/v1/gemini/chats/${chatId}/`);
      if (seq !== openSeq) return;
      const msgs = data.messages || [];
      for (const m of msgs) addMsg(m.role, m.content);
    } catch (e) {
      addMsg("sys", "History error: " + e.message);
    }
  }

  // ---------------------------
  // WebSocket Logic
  // ---------------------------
  function connectWs() {
    if (!activeChatId || !el("accessToken").value) return;

    const url = wsUrlForChat(activeChatId);
    setWsStatus(false, "CONNECTING...");

    const socket = new WebSocket(url);
    ws = socket;

    socket.onopen = () => {
      if (ws !== socket) return;
      setWsStatus(true, "CONNECTED");
      updateUiState();
    };

    socket.onmessage = (event) => {
      if (ws !== socket) return;
      try {
        const data = JSON.parse(event.data);
        if (data.Error) {
          hideTyping();
          addMsg("sys", "Error: " + data.Error);
          return;
        }

        if (data.role === "model") {
          hideTyping();
          // ❌ refreshChats(); <-- ВИДАЛЕНО! Це "клало" сервер.
        }

        addMsg(data.role || "sys", data.content);
      } catch (e) {
        console.error(e);
      }
    };

    socket.onclose = (ev) => {
      if (ws === socket) ws = null;
      hideTyping();
      setWsStatus(false, "DISCONNECTED");
      updateUiState();
    };
  }

  function sendPrompt() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const text = el("prompt").value.trim();
    if (!text) return;

    ws.send(JSON.stringify({ prompt: text }));
    el("prompt").value = "";
    showTyping();
  }
// ---------------------------
  // Utils / Helpers
  // ---------------------------
  function escapeHtml(text) {
    if (!text) return text;
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // Init
  el("loginBtn").onclick = login;
  el("logoutBtn").onclick = logout;
  el("refreshChatsBtn").onclick = refreshChats;
  el("newChatBtn").onclick = newChat;
  el("disconnectWsBtn").onclick = () => ws && ws.close();
  el("clearChatBtn").onclick = () => { chatBox.innerHTML = ""; hideTyping(); };
  el("sendBtn").onclick = sendPrompt;
  el("prompt").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendPrompt();
  });

  loadToken();
  updateUiState();
</script>
</body>
</html>
